<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right,#141e30,#243b55);
            min-height:100vh;
            color:white;
        }

        .hero{
            padding:100px 20px;
            text-align:center;
        }

        .card-box{
            background:white;
            color:black;
            border-radius:20px;
            padding:30px;
            transition:0.3s;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .card-box:hover{
            transform:translateY(-5px);
        }

        .btn-custom{
            border-radius:30px;
            padding:10px 25px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container hero">

    <h1 class="display-3 fw-bold mb-3">
        📚 Library Management System
    </h1>

    <p class="lead mb-5">
        Manage Books, Students, Admin Panel & Library Records Easily
    </p>

    <div class="row justify-content-center g-4">

        <div class="col-md-4">
            <div class="card-box">
                <h3>🔐 Login</h3>
                <p>Access your account securely.</p>

                <a href="/login" class="btn btn-primary btn-custom">
                    Login
                </a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box">
                <h3>📝 Register</h3>
                <p>Create a new student account.</p>

                <a href="/register" class="btn btn-success btn-custom">
                    Register
                </a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
