<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(135deg,#42275a,#734b6d);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            background:white;
            padding:40px;
            width:380px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        input,select{
            width:100%;
            padding:12px;
            margin-top:12px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#42275a;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#734b6d;
        }

        .link{
            text-align:center;
            margin-top:15px;
        }

        .link a{
            text-decoration:none;
            color:#42275a;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h2>📝 Register</h2>

    <form action="/register" method="post">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <select name="role" required>

            <option value="">
                Select Role
            </option>

            <option value="ADMIN">
                Admin
            </option>

            <option value="STUDENT">
                Student
            </option>

        </select>

        <button type="submit">
            Register
        </button>

    </form>

    <div class="link">
        <a href="/login">Already have account? Login</a>
    </div>

</div>

</body>
</html>
