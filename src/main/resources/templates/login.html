<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(135deg,#1d2671,#c33764);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:8px;
            border:1px solid #ccc;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            border:none;
            background:#1d2671;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#c33764;
        }

        .link{
            text-align:center;
            margin-top:15px;
        }

        .link a{
            text-decoration:none;
            color:#1d2671;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🔐 Login</h2>

    <form action="/login" method="post">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <div class="link">
        <a href="/register">New User? Register</a>
    </div>

</div>

</body>
</html>
