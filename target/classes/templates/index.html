<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Library Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">
    <h1>📚 Library Management Dashboard</h1>

    <!-- Add Book -->
    <div class="card">
        <h2>Add New Book</h2>
        <form action="/add" method="post" class="form-grid">
            <input type="text" name="title" placeholder="Book Title" required>
            <input type="text" name="author" placeholder="Author Name" required>
            <input type="number" name="quantity" placeholder="Quantity" required>
            <button type="submit">Add Book</button>
        </form>
    </div>

    <!-- Search Book -->
    <div class="card">
        <h2>Search Book</h2>
        <form action="/search" method="get" class="search-box">
            <input type="text" name="keyword" placeholder="Search by title or author">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Issue Book -->
    <div class="card">
        <h2>Issue Book</h2>
        <form action="/issue" method="post" class="form-grid">
            <input type="number" name="bookId" placeholder="Book ID" required>
            <input type="text" name="userName" placeholder="User Name" required>
            <button type="submit">Issue Book</button>
        </form>
    </div>

    <!-- Return Book -->
    <div class="card">
        <h2>Return Book</h2>
        <form action="/return" method="post" class="form-grid">
            <input type="number" name="bookId" placeholder="Book ID" required>
            <button type="submit">Return Book</button>
        </form>
    </div>

    <!-- Books Table -->
    <div class="card">
        <h2>Available Books</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.quantity}"></td>
                    <td class="actions">
                        <a th:href="@{/delete/{id}(id=${book.id})}" class="delete-btn">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
